name: Build and Push Docker Image

on:
  release:
    types: [created, published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY_URL: waddencr.azurecr.io 
      IMAGE_NAME: wadden-sea-backend
      REGISTRY_NAME: waddencr

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image with docker-compose
      run: docker compose build wadden-sea

    - name: Get version
      id: get-version
      run: |
        VERSION="${{ github.event.release.tag_name }}"
        if [ -z "$VERSION" ]; then
          echo "Error: github.event.release.tag_name is empty"
          exit 1
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "Version: ${VERSION}"

    - name: Tag Docker image
      run: |
        docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ steps.get-version.outputs.VERSION }}
        docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest
        # to be removed when fixing the wadden-sea-backend image in ACR
        docker tag ${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY_URL }}/vfn-rag:latest

    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURECR_PUSH_SERVICE_PRINCIPAL }}

    - name: Login to ACR
      run: az acr login --name ${{ env.REGISTRY_NAME }}

    - name: Push images to Azure Container Registry
      run: |
        docker push ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ steps.get-version.outputs.VERSION }}
        docker push ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest

        # to be removed when fixing the wadden-sea-backend image in ACR
        docker push ${{ env.REGISTRY_URL }}/vfn-rag:latest

    - name: Show pushed images
      run: |
        echo "Successfully pushed:"
        echo "- ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ steps.get-version.outputs.VERSION }}"
        echo "- ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest"